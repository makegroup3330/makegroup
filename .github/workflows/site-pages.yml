name: MAKE GROUP - Publish or switch website
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'keep: 현재 유지 / apply_design: 개선안 적용 / restore_original: 기존 복원'
        type: choice
        required: true
        default: keep
        options:
          - keep
          - apply_design
          - restore_original
permissions:
  contents: read
concurrency:
  group: makegroup-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select website and validate local links
        env:
          SITE_VERSION: ${{ inputs.version || 'keep' }}
        run: python3 _site_tools/manage_site.py --mode "$SITE_VERSION"
      - name: Record a manual website switch
        if: github.event_name == 'workflow_dispatch' && inputs.version != 'keep'
        env:
          SITE_VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' robots.txt sitemap.xml CNAME assets _site_tools/active-site.txt
          if ! git diff --cached --quiet; then
            git commit -m "Switch website: $SITE_VERSION"
            git push origin HEAD:main
          fi
      - name: Build static Pages artifact
        run: python3 _site_tools/manage_site.py --build _site_build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site_build
      - uses: actions/deploy-pages@v5
        id: deployment
